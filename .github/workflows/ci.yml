name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install uv
      - run: uv sync --locked
      - name: No absolute paths in code
        run: '! grep -rnI --exclude-dir=__pycache__ "/Users/\|C:\\\\" src/ scripts/ configs/'
      - run: uv run pytest -q
