name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install uv
      - run: uv sync --locked
      - name: No absolute paths in code
        run: '! grep -rn "/Users/\|C:\\\\" src/ scripts/ configs/'
      - run: uv run pytest -q
