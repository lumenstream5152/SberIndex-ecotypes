[project]
name = "ecotypes"
version = "0.1.0"
description = "Типы локальных экономик России: динамическая атрибутированная сеть муниципальных образований по данным СберИндекса (конкурс СберИндекс 2026, трек «Кластеризация»)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.1",
    "pandas>=3.0",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "pyarrow>=17.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "igraph>=1.0",
    "leidenalg>=0.10",
    "python-louvain>=0.16",
    "infomap>=2.8",
    "networkx>=3.4",
    "lightgbm>=4.5",
    "s-dbw>=0.1",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecotypes"]
