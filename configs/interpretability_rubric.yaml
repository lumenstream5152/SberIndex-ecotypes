# Рубрика интерпретируемости методов (PREREG §B: экспертная рубрика 1–5, два
# независимых оценщика, критерии зафиксированы ДО прогонов — этот файл создан
# 05.10.2026 до скорингового прогона 06).
#
# Шкала каждого критерия: 1 (плохо) … 5 (отлично). Оценка метода =
# среднее 5 критериев у одного оценщика; нога композита = среднее двух оценщиков.
# Оценщики заполняют НЕЗАВИСИМО, до знакомства с композитом. Заполнение — владельцу.
#
# Критерии (зафиксированы текстом, менять только через PREREG_DEVIATIONS.md):
criteria:
  C1_profile_readability: >-
    Читаемость профиля типа: насколько непосредственно по разбиению строится
    содержательный портрет (доминирующие категории, уровень, рост) без
    пост-обработки. Суррогатные правила (research/33) сходятся к глубине ≤4.
  C2_seed_robustness_of_story: >-
    Устойчивость интерпретации к seed/рестарту: один и тот же содержательный
    рассказ воспроизводится между прогонами (типы не «переплавляются»).
  C3_granularity: >-
    Разумность гранулярности: число типов в бюджете 4–10 (или обосновано
    иерархией), без вырождений (гигант+пыль) и без дробления в шум.
  C4_coverage: >-
    Покрытие: доля узлов, попадающих в интерпретируемые типы (нет массового
    остатка «прочее/неразмеченное», −1-узлы штрафуются).
  C5_independence_from_posthoc: >-
    Независимость от пост-хок украшательства: интерпретация следует из самого
    разбиения, а не из подогнанных порогов/исключений после факта.

# Баллы: scores.<метод>.rater_a / rater_b — среднее по 5 критериям (1–5) или
# покритериальный словарь {C1..C5: int}. ПУСТО = TODO владельцу (оценщики ещё
# не работали). Пока scores пусты — нога интерпретируемости в композите методов
# отсутствует: 06 репортирует обе версии (с нулём и перенормированную).
scores: {}
# Пример формата (закомментирован, не данные):
# scores:
#   kmeans:
#     rater_a: 4.0
#     rater_b: 3.8
